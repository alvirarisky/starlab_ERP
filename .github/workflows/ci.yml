name: CI

on:
  push:
    branches: [develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_AUTO_UPGRADE: 1
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-start-period=5s
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      BENCH_DIR: /home/runner/frappe-bench

    steps:
      # Checked out to a neutral path (not apps/starlab_lab_ops) because this
      # repo is a monorepo -- starlab_lab_ops is a subfolder of it, not the
      # repo root. Pointing bench get-app at the checkout root instead of the
      # actual starlab_lab_ops/ subfolder (as this workflow used to) makes
      # bench treat the whole monorepo as "the app", nesting its real package
      # one level too deep and breaking every doctype/report import -- same
      # bug the Docker build hit before docker/apps.json was switched to the
      # app-starlab-* subtree-split branches.
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('repo/*/pyproject.toml') }}

      - name: Install wkhtmltopdf
        run: |
          wget -q https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-3/wkhtmltox_0.12.6.1-3.jammy_amd64.deb
          sudo apt-get install -y ./wkhtmltox_0.12.6.1-3.jammy_amd64.deb

      - name: Install Bench CLI
        run: pip install frappe-bench

      # Pinned to the exact release tags this project is actually developed
      # and manually verified against (frappe v16.29.0 / erpnext v16.30.0 /
      # hrms v16.15.0 -- confirmed live via `bench list-apps` on the dev
      # instance), not the `version-16` branch. A branch is a moving target:
      # every fresh `bench get-app` can silently pull different upstream
      # code than the last build even though none of OUR code changed, which
      # is indistinguishable from a real regression until you've spent time
      # ruling it out. Bump these deliberately (and re-verify) rather than
      # letting them drift on their own.
      - name: Init bench
        run: |
          bench init "$BENCH_DIR" \
            --skip-redis-config-generation \
            --skip-assets \
            --python "$(which python)" \
            --frappe-branch v16.29.0

      - name: Point bench at CI services
        working-directory: ${{ env.BENCH_DIR }}
        run: |
          bench set-mariadb-host 127.0.0.1
          bench set-redis-cache-host redis://localhost:13000
          bench set-redis-queue-host redis://localhost:11000
          bench set-redis-socketio-host redis://localhost:11000
          bench set-config -g db_type mariadb

      - name: Set MariaDB server charset defaults
        run: |
          mysql --host=127.0.0.1 --user=root --password=root \
            -e "SET GLOBAL character_set_server = 'utf8mb4'; SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"

      # bench get-app's local-path support only works against a path that is
      # itself a git repo root (it internally runs `git clone <path>`, which
      # fails with "does not appear to be a git repository" on a bare
      # subfolder of a bigger repo -- confirmed by reproducing it directly).
      # repo/starlab_quality and repo/starlab_lab_ops are just subfolders of
      # the monorepo checkout, so give each one its own throwaway local .git
      # first. This is the CI equivalent of the app-starlab-* subtree-split
      # branches docker/apps.json builds from -- same underlying problem,
      # solved on the fly here instead of via a pre-published branch, so CI
      # always tests the current commit rather than a possibly-stale branch.
      - name: Turn app subfolders into standalone git repos
        run: |
          for app in starlab_quality starlab_lab_ops starlab_customizations starlab_integrations; do
            cd "${{ github.workspace }}/repo/$app"
            git init -q
            git add -A
            git -c user.email=ci@localhost -c user.name=CI commit -q -m "CI snapshot"
          done

      - name: Get ERPNext, HRMS and all 4 apps
        working-directory: ${{ env.BENCH_DIR }}
        run: |
          bench get-app erpnext --branch v16.30.0
          # hrms before starlab_customizations: its Role/Workspace "HR"
          # fixtures reference hrms DocTypes (Employee, Attendance, Leave
          # Application, dst) -- see docker/start.sh for the same ordering
          # requirement on the Docker side.
          bench get-app hrms --branch v16.15.0
          # Install order below mirrors required_apps in each app's hooks.py
          # (starlab_lab_ops needs starlab_quality; starlab_customizations
          # and starlab_integrations need starlab_lab_ops) -- bench get-app
          # needs each dependency's code present on disk before the app that
          # declares it in required_apps can cascade-install it.
          #
          # bench get-app takes exactly one meaningful positional argument (a
          # git URL or local path); it derives the app's install name from
          # that path's basename. A second positional is accepted only as a
          # legacy no-op, so passing the app name first ("get-app NAME PATH")
          # makes bench try to git-clone the literal string "NAME" as if it
          # were a URL -- exactly the previous CI failure.
          bench get-app "${{ github.workspace }}/repo/starlab_quality"
          bench get-app "${{ github.workspace }}/repo/starlab_lab_ops"
          bench get-app "${{ github.workspace }}/repo/starlab_customizations"
          bench get-app "${{ github.workspace }}/repo/starlab_integrations"

      - name: New site
        working-directory: ${{ env.BENCH_DIR }}
        run: |
          bench new-site test_site \
            --mariadb-root-password root \
            --admin-password admin \
            --install-app erpnext \
            --install-app hrms \
            --install-app starlab_quality \
            --install-app starlab_lab_ops \
            --install-app starlab_customizations \
            --install-app starlab_integrations
          bench --site test_site set-config allow_tests true

      # Runs all 4 custom apps' test suites (previously only starlab_lab_ops
      # was tested here -- the other 3 apps' tests, including the bulk of
      # this project's actual business-logic coverage in
      # starlab_customizations, were never run by CI at all). Every app runs
      # even if an earlier one fails, so a single broken suite doesn't hide
      # the results of the rest; the step still fails overall if any app had
      # failures.
      - name: Run tests
        working-directory: ${{ env.BENCH_DIR }}
        run: |
          failed=""
          for app in starlab_quality starlab_lab_ops starlab_customizations starlab_integrations; do
            echo "::group::Tests for $app"
            if ! bench --site test_site run-tests --app "$app"; then
              failed="$failed $app"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "Failing test suites:$failed"
            exit 1
          fi
