name: CI

on:
  push:
    branches: [develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_AUTO_UPGRADE: 1
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-start-period=5s
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      BENCH_DIR: /home/runner/frappe-bench

    steps:
      # Checked out to a neutral path (not apps/starlab_lab_ops) because this
      # repo is a monorepo -- starlab_lab_ops is a subfolder of it, not the
      # repo root. Pointing bench get-app at the checkout root instead of the
      # actual starlab_lab_ops/ subfolder (as this workflow used to) makes
      # bench treat the whole monorepo as "the app", nesting its real package
      # one level too deep and breaking every doctype/report import -- same
      # bug the Docker build hit before docker/apps.json was switched to the
      # app-starlab-* subtree-split branches.
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('repo/starlab_lab_ops/pyproject.toml') }}

      - name: Install wkhtmltopdf
        run: |
          wget -q https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-3/wkhtmltox_0.12.6.1-3.jammy_amd64.deb
          sudo apt-get install -y ./wkhtmltox_0.12.6.1-3.jammy_amd64.deb

      - name: Install Bench CLI
        run: pip install frappe-bench

      - name: Init bench
        run: |
          bench init "$BENCH_DIR" \
            --skip-redis-config-generation \
            --skip-assets \
            --python "$(which python)" \
            --frappe-branch version-16

      - name: Point bench at CI services
        working-directory: ${{ env.BENCH_DIR }}
        run: |
          bench set-mariadb-host 127.0.0.1
          bench set-redis-cache-host redis://localhost:13000
          bench set-redis-queue-host redis://localhost:11000
          bench set-redis-socketio-host redis://localhost:11000
          bench set-config -g db_type mariadb

      - name: Set MariaDB server charset defaults
        run: |
          mysql --host=127.0.0.1 --user=root --password=root \
            -e "SET GLOBAL character_set_server = 'utf8mb4'; SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"

      - name: Get ERPNext and this app
        working-directory: ${{ env.BENCH_DIR }}
        run: |
          bench get-app erpnext --branch version-16
          # starlab_quality first: starlab_lab_ops declares it in required_apps
          # (Test Parameter.metode_uji links to Document Master, owned by
          # starlab_quality) -- bench get-app needs its code present on disk
          # before installing starlab_lab_ops can cascade-install it.
          bench get-app starlab_quality "${{ github.workspace }}/repo/starlab_quality"
          bench get-app starlab_lab_ops "${{ github.workspace }}/repo/starlab_lab_ops"

      - name: New site
        working-directory: ${{ env.BENCH_DIR }}
        run: |
          bench new-site test_site \
            --mariadb-root-password root \
            --admin-password admin \
            --install-app erpnext \
            --install-app starlab_quality \
            --install-app starlab_lab_ops

      - name: Run tests
        working-directory: ${{ env.BENCH_DIR }}
        run: bench --site test_site run-tests --app starlab_lab_ops
